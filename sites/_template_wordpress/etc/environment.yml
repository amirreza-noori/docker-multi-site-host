# webdevops/php-apache runtime — loaded via docker-compose env_file

WEB_DOCUMENT_ROOT=/app
WEB_DOCUMENT_INDEX=index.php
CLI_SCRIPT=php /app/index.php


# PHP-FPM pool sizing (align with docker-compose mem_limit, typically 1g)
fpm.global.process_control_timeout=10m
fpm.global.process.max=30

fpm.pool.pm=dynamic
fpm.pool.pm.max_children=10
fpm.pool.pm.start_servers=3
fpm.pool.pm.min_spare_servers=2
fpm.pool.pm.max_spare_servers=6
fpm.pool.pm.process_idle_timeout=1m
fpm.pool.pm.max_requests=500
fpm.pool.request_terminate_timeout=60s
