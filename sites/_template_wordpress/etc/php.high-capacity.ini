; High-capacity sample — copy over php.ini (or mount this path) for a primary site
; on a large host (~56 CPU / 32g). Pair with environment.high-capacity.yml and
; docker-compose.high-capacity.snippet.yml.

display_errors = 0
short_open_tag = On
variables_order = "GPCS"
request_order = "GP"

; Remote URL include stays off; fopen wrappers needed by many WP/Woo plugins
allow_url_fopen = On
allow_url_include = Off

; Minimal shell lockdown — W3TC/Woo often need proc_open, symlink, link
disable_functions = exec,passthru,shell_exec,system,pcntl_exec,pcntl_fork,dl

; Per-request budget (pair with FPM max_children ~100 and compose mem_limit ~28g)
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 5000
expose_php = Off

date.timezone = Asia/Tehran
extension = timezonedb
extension = igbinary
extension = brotli

mysqli.default_host = mariadb

; Fewer realpath/stat calls on Docker bind mounts (wp-content)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; HTTPS-behind-HAProxy is in the image: /usr/local/etc/php/conf.d/zz-forwarded-https.ini
; (sets $_SERVER HTTPS + SERVER_PORT 443 from X-Forwarded-Proto — do not override auto_prepend_file)

; APCu — shared-memory user cache (extension ships in webdevops/php-apache)
apc.enabled = 1
apc.shm_size = 256M
apc.enable_cli = 0
apc.serializer = igbinary

; Zend OPcache — cut repeated PHP file I/O from the host mount
opcache.enable = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 20000
opcache.fast_shutdown = 1
opcache.enable_cli = 0
opcache.save_comments = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
