display_errors = 0
short_open_tag = On
variables_order = "GPCS"
request_order = "GP"

allow_url_fopen = On
allow_url_include = Off

; Per-request budget (pair with FPM max_children and compose mem_limit, typically 1g)
memory_limit = 256M
max_execution_time = 600
max_input_time = 300
post_max_size = 50M
upload_max_filesize = 50M
max_input_vars = 5000
expose_php = Off

date.timezone = Asia/Tehran
extension = timezonedb

mysqli.default_host = mariadb

; Fewer realpath/stat calls on Docker bind mounts (themes, plugins, uploads)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; HTTPS-behind-HAProxy is in the image: /usr/local/etc/php/conf.d/zz-forwarded-https.ini
; (sets $_SERVER HTTPS + SERVER_PORT 443 from X-Forwarded-Proto — do not override auto_prepend_file)

; Zend OPcache — cut repeated PHP file I/O from the host mount
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.fast_shutdown = 1
opcache.enable_cli = 0
opcache.save_comments = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
