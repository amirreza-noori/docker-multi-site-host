# High-capacity sample — use as env_file instead of environment.yml for a primary
# site on ~64 CPU / 32g host. Pair with:
#   php.high-capacity.ini
#   apache-mpm.high-capacity.conf  (mount into httpd conf.d)
#   docker-compose.high-capacity.snippet.yml
#   haproxy backend: longer timeout server + no-check (or check inter 5s fall 10)
#
# Budget (same box as MariaDB ~8–10g):
#   PHP workers ≈ 18g / ~80–100MB RSS ≈ 180–220 → max_children=200
# Apache MaxRequestWorkers must be >= max_children (see apache-mpm.high-capacity.conf).
# MariaDB max_connections >= max_children + other sites (e.g. 1000).

WEB_DOCUMENT_ROOT=/app
WEB_DOCUMENT_INDEX=index.php
CLI_SCRIPT=php /app/index.php

fpm.global.process_control_timeout=10m
fpm.global.process.max=250

fpm.pool.pm=dynamic
fpm.pool.pm.max_children=200
fpm.pool.pm.start_servers=50
fpm.pool.pm.min_spare_servers=25
fpm.pool.pm.max_spare_servers=100
fpm.pool.pm.process_idle_timeout=5m
fpm.pool.pm.max_requests=500
fpm.pool.request_terminate_timeout=60s
# Larger backlog so Apache does not refuse while FPM spawns
fpm.pool.listen.backlog=10240
