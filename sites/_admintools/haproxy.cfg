# Portainer / phpMyAdmin are localhost-only (see docker-compose.yml ports).
# Do not expose them on public HAProxy. Access via SSH tunnel, e.g.:
#   ssh -L 9000:127.0.0.1:9000 -L 8081:127.0.0.1:8081 user@server
#
# If you must terminate TLS at HAProxy, uncomment below and restrict by source IP:
#
#     acl admin_src src 203.0.113.10
#     acl host_portainer hdr(host) -i portainer.example.com
#     acl host_phpmyadmin hdr(host) -i pma.example.com
#     use_backend portainer_backend if host_portainer admin_src
#     use_backend phpmyadmin_backend if host_phpmyadmin admin_src
#
# ## backend ##
#
# backend portainer_backend
#     mode http
#     server portainer host.docker.internal:9000
#
# backend phpmyadmin_backend
#     mode http
#     server phpmyadmin host.docker.internal:8081

