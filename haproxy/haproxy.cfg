global
    maxconn 4096
    tune.ssl.default-dh-param 2048

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    # Backend hostnames (container DNS) — longer TTL cuts resolve churn under load
    hold valid 30s
    hold obsolete 30s

defaults
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-keep-alive 10s
    option redispatch
    option http-keep-alive
    # Reuse idle backend connections (critical when many sites share one HAProxy)
    http-reuse safe
    retries 3
    errorfile 503 /usr/local/etc/haproxy/source/errors/503.http
    default-server init-addr none inter 2s rise 2 fall 3 check resolvers docker

frontend front
    bind *:80
    bind *:443 ssl crt /etc/letsencrypt/haproxy/ crt /etc/letsencrypt/haproxy/dummy.pem
    option forwardfor

    # Client-facing scheme for backends (overwrite; backends speak HTTP :80)
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-header X-Forwarded-Port 443 if { ssl_fc }
    http-request set-header X-Forwarded-Port 80 if !{ ssl_fc }

    acl is_acme path_beg -i /.well-known/acme-challenge/
    acl need_redirect hdr_beg(host) -i www. || !{ ssl_fc }
    http-request redirect code 301 location https://%[hdr(host),regsub(^www\.,,i)]%[path]%[query,concat(?)] if need_redirect !is_acme

    acl acme_challenge_certbot path_beg -i /.well-known/acme-challenge/
    use_backend acme_challenge_certbot_backend if acme_challenge_certbot

# @@INCLUDE_FRONT@@

    default_backend not_found_backend

backend not_found_backend
    mode http
    http-request return status 404 content-type "text/plain" string "Not Found"

backend acme_challenge_certbot_backend
    mode http
    server certbot certbot:80

# @@INCLUDE_BACK@@
