# WordPress hardening — applied for every site container (vhost common include)

# Block XML-RPC at the server (independent of site .htaccess)
<Files "xmlrpc.php">
    Require all denied
</Files>

# Deny PHP / script execution under uploads
<Directory "/app/wp-content/uploads">
    <FilesMatch "\.ph(p[0-9]?|tml|ar|ps)$">
        Require all denied
    </FilesMatch>
    Options -ExecCGI
    AllowOverride All
    Require all granted
</Directory>
